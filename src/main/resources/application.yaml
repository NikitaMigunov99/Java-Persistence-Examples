server:
  port: 7010

generator:
  clients:
    - name: ios
      code: IOS
      request-number: 5000000
      request-number-unit: DAYS

    - name: android
      code: ANDROID
      request-number: 3000000
      request-number-unit: DAYS

    - name: partner
      code: PARTNER
      request-number: 50
      request-number-unit: HOURS

logging:
  level:
    org:
      springframework:
        transaction: DEBUG
      hibernate:
        type: trace
    project:
      user:
        UserClient: DEBUG
spring:
  application:
    name: Java Persistence Examples
  datasource:
    url: jdbc:h2:mem:mydb
    username: sa
    password: password
    driverClassName: org.h2.Driver
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddlAuto: none

app:
  scheduler:
    start-time: "18:00"
    end-time: "12:30"
    delay-ms: 3000 # 3 seconds